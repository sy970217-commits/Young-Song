<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>할 일 목록</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>할 일 목록 (이번 주 장볼 것)</h1>
  <button id="theme" type="button">어두운 화면</button>
  <input id="item" placeholder="살 것 적기">
  <select id="category">
    <option>장보기</option>
    <option>업무</option>
    <option>집안일</option>
    <option>기타</option>
  </select>
  <input id="due" type="date" aria-label="마감일">
  <button id="add" type="button">추가</button>
  <button id="toggle-done" type="button">완료한 것 숨기기</button>
  <ul id="list"></ul>
  <p>남은 개수: <span id="count">0</span></p>
  <script src="script.js"></script>
</body>
</html>
